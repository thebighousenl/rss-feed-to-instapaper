max_age_days: 1
# max_initial_items: 10  # uncomment to cap articles added on first sync per feed (prevents first-run floods)
# archive_retention_days: 30  # uncomment to delete archived articles from Instapaper after N days
# clear_archive_on_sync: true  # uncomment to delete all archived articles on every sync (overrides archive_retention_days)
# disable_date_sort: true  # uncomment to add articles in feed order instead of newest-first

feeds:
  - url: "https://example.com/feed.xml"
    label: "Example Blog"
  - url: "https://another-blog.com/rss"
    label: "Another Blog"
    # enabled: false  # uncomment to temporarily pause this feed
    # include: ["Go", "Rust"]  # only add articles whose title matches one of these (case-insensitive regex)
    # exclude: ["NFT", "crypto"]  # skip articles whose title matches any of these
    # max_age_days: 14  # override the global max_age_days for this feed (>= 1)
    # archive_retention_days: 0  # override archive_retention_days for this feed (0 = never delete); ignored if clear_archive_on_sync is true
